<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Form đăng ký</title>
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>Thông tin tài khoản</legend>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="you@email.com"><br><br>

            <label for="pass">Mật khẩu</label>
            <input type="password" id="pass" name="pass" required minlength="8"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Ít nhất 8 ký tự, gồm chữ hoa, thường và số"><br><br>

            <label for="phone">SĐT:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="0101234567"><br><br>

            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" max="2010-01-01">
        </fieldset>
        <label>
            <input type="checkbox" name="agree" required>
            Tôi đồng ý điều khoản
        </label><br><br>

        <button type="submit">Đăng ký</button>
    </form>
</body>
</html>
