<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout E-Commerce</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h2>Minh Anh</h2>
        </header>
        <section class="hero">
            <div class="hero-item featured">🔥 Sản phẩm nổi bật</div>
            <div class="hero-item">Sale</div>
            <div class="hero-item">Freeship toàn quốc</div>
        </section>
        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <label><input type="checkbox"> Hoa sinh nhật</label><br>
            <label><input type="checkbox"> Hoa cưới</label><br>
            <label><input type="checkbox"> Hoa khai trương</label>
        </aside>
        <main class="main">
            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/4041_doa-hoa-diu-dang.jpg" alt="Hoa kiểu Hàn">
                <h4>Hoa Hàn Quốc - Đóa hoa dịu dàng</h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/3653_trai-tim-diu-dang.jpg" alt="Hoa tone tím">
                <h4>Trái tim dịu dàng</h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/16060_shine-on-me.jpg" alt="Hoa nhập khẩu">
                <h4>Shine on me</h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15296_cam-tu-cau-va-em.jpg" alt="Cẩm tú cầu">
                <h4>Cẩm tú cầu và em</h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/14647_cheers.jpg" alt="Hoa hội nghị">
                <h4>Hoa hội nghị </h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/2453_garden-style.jpg" alt="">
                <h4>Garden-style</h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15023_capuchino-love.jpg" alt="Capuchino love ">
                <h4>Capuchino love</h4>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15146_rainbow-love.jpg" alt="Rainbow love">
                <h4>Rainbow love</h4>
            </div>
        </main>
        <aside class="ads">
            <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-tinh-yeu/16062_blooming-love.jpg" alt="Hoa kiểu Hàn">
        </aside>
        <footer class="footer">
            <p>© 2026 Minh Anh</p>
        </footer>
    </div>
</body>
</html>
