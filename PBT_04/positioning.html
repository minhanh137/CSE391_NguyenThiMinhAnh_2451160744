<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Layout</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>
    <header class="header">
        <div class="logo">Minh Anh</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Danh mục</h3>
            <ul>
                <li>Hoa sinh nhật</li>
                <li>Hoa cưới</li>
                <li>Hoa khai trương</li>
                <li>Hoa tình yêu</li>
            </ul>
        </aside>

        <main class="content">
            <div class="card">
                <span class="badge">HOT</span>
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/4041_doa-hoa-diu-dang.jpg" alt="Hoa kiểu Hàn">
                <h3>Đóa hoa dịu dàng</h3>
            </div>

            <div class="card">
                <span class="badge">HOT</span>
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/3653_trai-tim-diu-dang.jpg" alt="Hoa tone tím">
                <h3>Trái tim dịu dàng</h3>
            </div>

            <div class="card">
                <span class="badge">HOT</span>
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/16060_shine-on-me.jpg" alt="Hoa nhập khẩu">
                <h3>Shine on me</h3>
            </div>

            <div class="card">
                <span class="badge">HOT</span>
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15296_cam-tu-cau-va-em.jpg" alt="Cẩm tú cầu">
                <h3>Cẩm tú cầu và em</h3>
            </div>
        </main>

    </div>
    <button class="scroll-top">↑</button>
</body>
</html>
