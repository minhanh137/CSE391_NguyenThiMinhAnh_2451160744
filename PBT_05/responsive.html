<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <header class="header">
        <div class="logo">Minh Anh</div>
        <div class="hamburger">☰</div>
        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Sale</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <div class="container">
        <aside class="sidebar">
            <h3>Filters</h3>
            <select>
                <option>Hoa trang trí</option>
                <option>Hoa sinh nhật</option>
                <option>Hoa tình yêu</option>
                <option>Hoa công sở</option>
            </select>
            <select>
                <option>Price</option>
                <option>0 - 100$</option>
                <option>100 - 500$</option>
                <option>500$+</option>
            </select>
        </aside>
        <main class="products">
            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/4041_doa-hoa-diu-dang.jpg" alt="Hoa kiểu Hàn">
                <h3>Đóa hoa dịu dàng</h3>
                <p>$100</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/3653_trai-tim-diu-dang.jpg" alt="Hoa tone tím">
                <h3>Trái tim dịu dàng</h3>
                <p>$120</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/16060_shine-on-me.jpg" alt="Hoa nhập khẩu">
                <h3>Shine on me</h3>
                <p>$90</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15296_cam-tu-cau-va-em.jpg" alt="Cẩm tú cầu">
                <h3>Cẩm tú cầu và em</h3>
                <p>$150</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/14647_cheers.jpg" alt="Hoa hội nghị">
                <h3>Hoa hội nghị </h3>
                <p>$80</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/2453_garden-style.jpg" alt="">
                <h3>Garden-style</h3>
                <p>$200</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15023_capuchino-love.jpg" alt="Capuchino love ">
                <h3>Capuchino love</h3>
                <p>$60</p>
                <button class="btn">Mua</button>
            </div>

            <div class="card">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15146_rainbow-love.jpg" alt="Rainbow love">
                <h3>Rainbow love</h3>
                <p>$110</p>
                <button class="btn">Mua</button>
            </div>

        </main>

        <aside class="ads">
            <h3>🔥 Summer Sale</h3>
            <p>Giảm 50%!</p>
        </aside>

    </div>

    <footer class="footer">
        <p>© 2026 Minh Anh. All rights reserved.</p>
    </footer>

</body>
</html>
