<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>
    <header class="header">
        <h1>Flower Shop</h1>
    </header>
    <div class="spinner"></div>
    <main class="products">
        <div class="card fade-in">
            <div class="img-box">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/4041_doa-hoa-diu-dang.jpg" alt="">
            </div>
            <div class="content">
                <h3>Đóa hoa dịu dàng</h3>
                <p>$100</p>
                <button class="btn">Mua ngay</button>
            </div>
        </div>
        <div class="card fade-in">
            <div class="img-box">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/3653_trai-tim-diu-dang.jpg" alt="">
            </div>
            <div class="content">
                <h3>Trái tim dịu dàng</h3>
                <p>$120</p>
                <button class="btn">Mua ngay</button>
            </div>
        </div>
        <div class="card fade-in">
            <div class="img-box">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/hoa-chuc-mung/16060_shine-on-me.jpg" alt="">
            </div>

            <div class="content">
                <h3>Shine on me</h3>
                <p>$90</p>
                <button class="btn">Mua ngay</button>
            </div>
        </div>
        <div class="card fade-in">
            <div class="img-box">
                <img src="https://hoayeuthuong.com/hinh-hoa-chinh/bo-hoa-tuoi/15296_cam-tu-cau-va-em.jpg" alt="">
            </div>
            <div class="content">
                <h3>Cẩm tú cầu và em</h3>
                <p>$150</p>
                <button class="btn">Mua ngay</button>
            </div>
        </div>

    </main>
</body>
</html>
